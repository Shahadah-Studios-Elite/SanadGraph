name: Build TypeScript & Deploy SanadGraph

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cytoscape & Compile TypeScript
        run: |
          npm install --no-save cytoscape typescript
          cp node_modules/cytoscape/dist/cytoscape.min.js ./cytoscape.min.js
          if [ -f "src/type.ts" ]; then mv src/type.ts src/types.ts; fi
          npx tsc src/*.ts --outDir dist --target ES2020 --module ES2020 --skipLibCheck --ignoreConfig

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
